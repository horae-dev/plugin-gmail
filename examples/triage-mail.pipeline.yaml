# examples/triage-mail.pipeline.yaml (plugin-gmail 0.2.1): Gmail triage into tasks.
#
# An example to copy into your instance's pipelines/ folder (the core does not install a
# plugin's pipelines yet, and this one needs your rules and paths). Every parameter below is
# trusted configuration. See the README, "Triage".
#
# 1. collect: `gmail.triage` reads the mail that arrived since the last run, applies YOUR rules
#    (no model), proposes a task.create for the mail a rule made a task, and returns, as data,
#    only the mail no rule decided.
# 2. llm: the core's one bounded model step runs the skill gmail/triage-mail on that data, and
#    proposes a task.create for each real request. Plugins never call a model.
# 3. act: both kinds of task are written by the tasks sink. The Gmail link a rule-made task
#    carries is routed by `link_prefix` (a task whose link is outside it fails the step).
name: triage-mail
trigger: { cron: "*/30 * * * *" }       # or run by an external scheduler: `horae run triage-mail`
steps:
  - collect:
      - gmail.triage:
          # A file in a directory granted for writing in horae.lock (`paths.write`).
          state_path: /var/lib/horae/gmail-state.json
          account: mail
          max_messages: 25
          rules:
            # First match wins; a message no rule matches goes to the model.
            - name: promotions
              action: ignore
              label: [CATEGORY_PROMOTIONS, CATEGORY_SOCIAL]
            - name: newsletters
              action: ignore
              list_id: ["*"]
            - name: bills
              action: task
              from: ["billing@orange.example"]
              subject: ["*invoice*", "*facture*"]
              task_prefix: "Pay: "
              due_in_days: 14
            - name: school
              action: interpret              # always to the model, never ignored below
              from: ["*@school.example.org"]
  - llm:
      skill: gmail/triage-mail
      model: default                         # alias resolved in horae.yaml
      budget: { usd: 0.05, tokens_out: 2000 }
      skip_when_empty: ["[].data.needs_interpretation"]  # every mail decided by the rules: no call, no cost
      on_unchanged_input: skip               # $0 path: the same input (for example an empty batch) makes no call
  - act:
      - obsidian.write_task: { mode: tasks, link_prefix: "https://mail.google.com/mail/u/0/" }
