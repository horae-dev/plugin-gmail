description: "An invented message id in a task fingerprint is refused by the guard (decision 67)."
budget: { usd: 0.05, tokens_out: 2000 }
input:
  - source: gmail.triage
    params: {"state_path": "/var/lib/horae/gmail-state.json", "account": "mail", "max_messages": 25}
    data:
      account: "mail"
      baselined: false
      reset: false
      decisions:
        - {"id": "18f0b0000000a001", "thread_id": "18f0b0000000a001", "action": "interpret", "decided": false, "rule": null}
      counts: {"ignore": 0, "task": 0, "interpret": 1, "decided": 0}
      needs_interpretation:
