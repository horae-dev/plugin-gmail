# Synthetic data. The input is the collect step's output for pipelines/triage-mail.yaml:
# the mail the rules did not decide, as gmail.triage returns it.
schema_version: 1
description: "A shipping notice is no task."
budget: { usd: 0.05, tokens_out: 2000 }
input:
  - source: gmail.triage
    params: {"state_path": "/var/lib/horae/gmail-state.json", "account": "mail", "max_messages": 25}
    data:
      account: "mail"
      baselined: false
      reset: false
      decisions:
        - {"id": "18f0b0000000a005", "thread_id": "18f0b0000000a005", "action": "interpret", "decided": false, "rule": null}
      counts: {"ignore": 0, "task": 0, "interpret": 1, "decided": 0}
      needs_interpretation:
        - {"id": "18f0b0000000a005", "from": "ShipIt \\<tracking@shipit.example\\>", "subject": "Your parcel is on its way", "date": "Wed, 04 Nov 2026 10:20:00 +0100", "snippet": "Your order 88231 left our warehouse and will arrive on 2026-11-12. Track it with the number 7A90113."}
      truncated: false
      skipped: 0
      state_updated: true
expect:
  schema_valid: true
  assertions:
    - {"pointer": "/output/triaged", "length": 1}
    - {"pointer": "/intents", "length": 0}
    - {"pointer": "/output/triaged/0/outcome", "equals": "no_task"}
  intent_counts: { task.create: 0 }
  guard: pass
