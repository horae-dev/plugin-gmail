# Synthetic data. The input is the collect step's output for pipelines/triage-mail.yaml:
# the mail the rules did not decide, as gmail.triage returns it.
schema_version: 1
description: "A school notice in French with a day/month/year date becomes a task due that day."
budget: { usd: 0.05, tokens_out: 2000 }
input:
  - source: gmail.triage
    params: {"state_path": "/var/lib/horae/gmail-state.json", "account": "mail", "max_messages": 25}
    data:
      account: "mail"
      baselined: false
      reset: false
      decisions:
        - {"id": "18f0b0000000a003", "thread_id": "18f0b0000000a003", "action": "interpret", "decided": false, "rule": null}
      counts: {"ignore": 0, "task": 0, "interpret": 1, "decided": 0}
      needs_interpretation:
        - {"id": "18f0b0000000a003", "from": "Ecole Jules Ferry \\<office@school.example.org\\>", "subject": "Sortie scolaire : autorisation à rendre", "date": "Tue, 03 Nov 2026 08:05:00 +0100", "snippet": "Chers parents, merci de rendre l'autorisation signée pour la sortie au musée avant le 14/11/2026. Cordialement, la direction"}
      truncated: false
      skipped: 0
      state_updated: true
expect:
  schema_valid: true
  assertions:
    - {"pointer": "/output/triaged", "length": 1}
    - {"pointer": "/intents", "length": 1}
    - {"pointer": "/intents/0/fingerprint", "matches": "^gmail:[0-9a-f]{16}$"}
    - {"pointer": "/intents/0/title", "not_contains": "http"}
    - {"pointer": "/intents/0/due", "equals": "2026-11-14"}
  intent_counts: { task.create: 1 }
  guard: pass
