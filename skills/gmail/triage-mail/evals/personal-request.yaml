# Synthetic data. The input is the collect step's output for pipelines/triage-mail.yaml:
# the mail the rules did not decide, as gmail.triage returns it.
schema_version: 1
description: "A personal request from a person becomes a task."
budget: { usd: 0.05, tokens_out: 2000 }
input:
  - source: gmail.triage
    params: {"state_path": "/var/lib/horae/gmail-state.json", "account": "mail", "max_messages": 25}
    data:
      account: "mail"
      baselined: false
      reset: false
      decisions:
        - {"id": "18f0b0000000a006", "thread_id": "18f0b0000000a006", "action": "interpret", "decided": false, "rule": null}
      counts: {"ignore": 0, "task": 0, "interpret": 1, "decided": 0}
      needs_interpretation:
        - {"id": "18f0b0000000a006", "from": "Marc Dupont \\<marc.dupont@example.net\\>", "subject": "Lease scan", "date": "Wed, 04 Nov 2026 18:45:00 +0100", "snippet": "Hey, can you send me the scan of the lease when you get a minute? The notary asked for it. Thanks, Marc"}
      truncated: false
      skipped: 0
      state_updated: true
expect:
  schema_valid: true
  assertions:
    - {"pointer": "/output/triaged", "length": 1}
    - {"pointer": "/intents", "length": 1}
    - {"pointer": "/intents/0/fingerprint", "matches": "^gmail:[0-9a-f]{16}$"}
    - {"pointer": "/intents/0/title", "not_contains": "http"}
  intent_counts: { task.create: 1 }
  guard: pass
