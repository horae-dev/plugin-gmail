# Synthetic data. The input is the collect step's output for pipelines/triage-mail.yaml:
# the mail the rules did not decide, as gmail.triage returns it.
schema_version: 1
description: "A mail too vague to act on is no task, with low confidence."
budget: { usd: 0.05, tokens_out: 2000 }
input:
  - source: gmail.triage
    params: {"state_path": "/var/lib/horae/gmail-state.json", "account": "mail", "max_messages": 25}
    data:
      account: "mail"
      baselined: false
      reset: false
      decisions:
        - {"id": "18f0b0000000a009", "thread_id": "18f0b0000000a009", "action": "interpret", "decided": false, "rule": null}
      counts: {"ignore": 0, "task": 0, "interpret": 1, "decided": 0}
      needs_interpretation:
        - {"id": "18f0b0000000a009", "from": "Sam \\<sam@example.com\\>", "subject": "Quick question", "date": "Fri, 06 Nov 2026 12:00:00 +0100", "snippet": "Did you see my last message?"}
      truncated: false
      skipped: 0
      state_updated: true
expect:
  schema_valid: true
  assertions:
    - {"pointer": "/output/triaged", "length": 1}
    - {"pointer": "/intents", "length": 0}
    - {"pointer": "/output/triaged/0/confidence", "equals": "low"}
  intent_counts: { task.create: 0 }
  guard: pass
