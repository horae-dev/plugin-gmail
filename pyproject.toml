[project]
name = "horae-plugin-gmail"
version = "0.4.0"
description = "The Gmail Horae plugin: OAuth, read-only recent headers, and rules-first triage into tasks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "horae-sdk>=0.9,<0.10",
    "httpx>=0.28.1,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horae_gmail"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7",
    "ruff>=0.17",
    "types-pyyaml>=6",
]

# No uv source table: every package of uv.lock comes from PyPI with hashes, which is what the
# core's installer requires (it refuses a git source anywhere in the lock, dev group included).
# The core (`horae`) is not on PyPI: the golden-case tests need it, so CI and developers add it
# for one run, outside the lock: `uv run --with "$HORAE_CORE" pytest` (see README, Development).

[tool.uv]
required-version = ">=0.13"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["horae_gmail"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
